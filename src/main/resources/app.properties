# Environment (development | production)
# In production, all secrets must be 32+ characters and cannot contain 'change-me', 'default', 'example', or 'test'
app.environment=development

# Database
db.url=jdbc:h2:file:./data/examprep;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=
db.driver=org.h2.Driver

# JWT (SECURITY: Override with JWT_SECRET environment variable in production)
# Must be 32+ characters, no insecure patterns
jwt.secret=change-me-in-production-use-long-random-string
jwt.ttl.hours=24

# Opaque URL id encryption (SECURITY: Override with ID_CIPHER_SECRET environment variable in production)
# Must be 32+ characters, no insecure patterns
id.cipher.secret=change-me-id-cipher-secret

# Funnel webhook / API (SECURITY: Override with FUNNEL_API_KEY environment variable in production)
# Required to create access tokens. Must be 32+ characters, no insecure patterns
funnel.api.key=change-me-funnel-api-key

# H2 console (SECURITY: Disable in production by setting to false)
# Development only - allows direct database access at /h2-console
h2.console.enabled=false

# Cookie security flags
# Set to true in production (requires HTTPS)
cookie.secure=false
# Options: Strict, Lax, None
cookie.samesite=Lax
