# Environment (development | production)
# In production, all secrets must be 32+ characters and cannot contain 'change-me', 'default', 'example', or 'test'
app.environment=development

# Database
db.url=jdbc:h2:file:./data/examprep;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=
db.driver=org.h2.Driver

# JWT (SECURITY: Override with JWT_SECRET environment variable in production)
# Must be 32+ characters, no insecure patterns
jwt.secret=change-me-in-production-use-long-random-string
jwt.ttl.hours=24

# Opaque URL id encryption (SECURITY: Override with ID_CIPHER_SECRET environment variable in production)
# Must be 32+ characters, no insecure patterns
id.cipher.secret=change-me-id-cipher-secret

# Funnel webhook / API (SECURITY: Override with FUNNEL_API_KEY environment variable in production)
# Required to create access tokens. Must be 32+ characters, no insecure patterns
funnel.api.key=change-me-funnel-api-key

# H2 console (SECURITY: Disable in production by setting to false)
# Development only - allows direct database access at /h2-console
h2.console.enabled=false

# Cookie security flags
# Set cookie.secure=true in production (requires HTTPS). Also set when SameSite=None.
cookie.secure=false
# Options: Strict, Lax, None — read by WebUtil
cookie.samesite=Lax
# Trust X-Forwarded-For / X-Forwarded-Proto only behind a known reverse proxy
proxy.trust.forwarded=false

# Public base URL for email digest links (optional)
app.public.url=

# Weekly regimen sampling
weekly.questions.per.subject=4
weekly.checkpoint.questions=8
weekly.checkpoint.duration.minutes=15
weekly.checkpoint.min.fresh=5

# Rate limiting for API endpoints
# Maximum number of requests per window
rate.limit.api.max.requests=10
# Window size in minutes
rate.limit.api.window.minutes=1

# Rate limiting for login / register / password reset (per IP)
rate.limit.auth.max.requests=8
rate.limit.auth.window.minutes=15

# Failed-login lockout (per username, in-memory)
login.lockout.max.failures=5
login.lockout.window.minutes=15

# Password reset
password.reset.ttl.minutes=60

# SMTP (optional). When mail.smtp.host is blank, mail stays in email_outbox + stdout.
mail.smtp.host=
mail.smtp.port=587
mail.smtp.username=
mail.smtp.password=
mail.smtp.starttls=true
mail.from=

# n8n (optional). Leave webhook URLs blank to hide the send forms.
# Configure n8n workflows to Respond Immediately. Do not store Google credentials here.
# SECURITY: Override with N8N_WEBHOOK_* environment variables in production.
n8n.webhook.questions=
n8n.webhook.analyze=
n8n.webhook.secret=change-me-n8n-webhook-secret

# Admin account configuration (SECURITY: Override with environment variables in production)
# ADMIN_USERNAME - Admin username (optional, defaults to 'admin')
# ADMIN_PASSWORD - Admin password (REQUIRED in production, defaults to 'admin123' in development)
# Production deployments MUST set ADMIN_PASSWORD environment variable
